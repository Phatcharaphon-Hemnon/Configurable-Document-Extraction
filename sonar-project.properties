# ── Identity ──────────────────────────────────────────────────────────────────
# Must match exactly what you see on sonarcloud.io/project/overview
sonar.organization=phatcharaphon-hemnon
sonar.projectKey=Phatcharaphon-Hemnon_Configurable-Document-Extraction
sonar.projectName=Configurable-Document-Extraction

# ── Sources ───────────────────────────────────────────────────────────────────
# Comma-separated list of directories that contain source code
sonar.sources=Backend,frontend

# ── Language hints ────────────────────────────────────────────────────────────
sonar.python.version=3.11

# ── Exclusions ────────────────────────────────────────────────────────────────
sonar.exclusions=\
  **/.venv/**,\
  **/node_modules/**,\
  **/__pycache__/**,\
  **/build/**,\
  **/dist/**,\
  **/coverage/**,\
  **/*.min.js,\
  **/static/**

# ── Test & coverage (optional – add paths when you have them) ─────────────────
# sonar.tests=Backend/tests
# sonar.python.coverage.reportPaths=coverage.xml
# sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ── Encoding ──────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
