name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  backend-lint:
    name: "Backend / Lint (ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check api/

  backend-tests:
    name: "Backend / Tests (pytest)"
    runs-on: ubuntu-latest
    needs: backend-lint
    env:
      NVIDIA_API_KEY: dummy-token-for-ci
      OPENROUTER_API_KEY: dummy-token-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install pytest pytest-asyncio anyio
      - name: Run backend tests
        run: pytest api/tests/ -v --durations=10

  frontend-build:
    name: "Frontend / Type-check & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  release-reports:
    name: "Release / Evaluation assets"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-release-assets
          if-no-files-found: error
          path: |
            eval_report.md
            eval_artifacts/metrics.json
            eval_artifacts/predictions.json
