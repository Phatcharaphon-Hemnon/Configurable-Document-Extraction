name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  backend-lint:
    name: "Backend / Lint (ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check apps/api/

  backend-tests:
    name: "Backend / Tests (pytest)"
    runs-on: ubuntu-latest
    needs: backend-lint
    env:
      NVIDIA_API_KEY: dummy-token-for-ci
      OPENROUTER_API_KEY: dummy-token-for-ci
      LLAMA_CLOUD_API_KEY: dummy-token-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-asyncio anyio
      - name: Run backend tests
        run: pytest apps/api/tests/ -v --durations=10

  frontend-build:
    name: "Frontend / Type-check & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
